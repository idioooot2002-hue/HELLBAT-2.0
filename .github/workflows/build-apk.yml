
name: Build HELLBAT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HELLBAT_ANDROID_PROJECT.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack Android project
        run: unzip -q HELLBAT_ANDROID_PROJECT.zip -d source

      - name: Build debug APK
        working-directory: source/HELLBAT_ANDROID_PROJECT
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HELLBAT-debug-apk
          path: source/HELLBAT_ANDROID_PROJECT/app/build/outputs/apk/debug/app-debug.apk
